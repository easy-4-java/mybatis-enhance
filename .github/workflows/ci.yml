# CI workflow for the feature/1.0.x line (JDK 8)
#
# Triggers:
#   - push / pull_request on the feature/1.0.x branch
#   - manual workflow_dispatch
#
# Runs `mvn -B clean verify` which includes the JaCoCo coverage check
# (90% line coverage, currently nonblocking) configured in the POM.
name: CI

on:
  push:
    branches: [feature/1.0.x]
  pull_request:
    branches: [feature/1.0.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: JDK 8 Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify with JaCoCo coverage check
        run: mvn -B --no-transfer-progress clean verify

      - name: Confirm TypeHandler and Jackson tests ran with coverage
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree
          module = Path('mybatis-enhance-typehandler/target')
          for suite, minimum in [('TypeHandlerContractTest', 16), ('JacksonTypeHandlerTest', 7)]:
              report = module / 'surefire-reports' / f'TEST-org.apache.ibatis.enhance.typehandler.{suite}.xml'
              tests = int(ElementTree.parse(report).getroot().attrib['tests'])
              assert tests >= minimum, f'{suite}: expected at least {minimum} tests, got {tests}'
              print(f'{suite}: {tests} tests executed')
          coverage = ElementTree.parse(module / 'site/jacoco/jacoco.xml').getroot()
          classes = {node.attrib['name'].rsplit('/', 1)[-1]: node for node in coverage.findall('.//class')}
          for name in ('AbstractJacksonJsonTypeHandler', 'MyJacksonTypeHandler',
                       'JsonStringTypeHandler', 'ListTypeHandler'):
              covered = int(classes[name].find("counter[@type='LINE']").attrib['covered'])
              assert covered > 0, f'{name}: no Jackson handler lines covered'
              print(f'{name}: {covered} lines covered')
          PYTEST

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco'
          retention-days: 14

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 14
